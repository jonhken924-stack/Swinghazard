<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA SWING B V4 LOCKED</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.card{background:#161616;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px}
.green{color:#00ff88}.red{color:#ff4444}.yellow{color:#ffcc00}
button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;font-size:16px}
.buy{background:#00ff88;color:#000}.sell{background:#ff4444;color:#fff}
.zone{font-size:20px;font-weight:bold;margin:6px 0}
</style>
</head>
<body>
<h2>NOVA SWING B V4 🔒 LOCKED</h2>
<div class="card">
Gold: <b id="price">$---</b> | <span id="status">Waiting 10:00 lock</span><br>
Locked Signal Date: <b id="lockdate">--</b>
</div>

<div class="card">
4H SIGNAL (Locked at 10:00, won't change):<br>
<div id="zone" class="zone yellow">Waiting for 10:00 to lock signal...</div>
<div id="action" style="font-size:13px;color:#aaa">At 10:00 I will lock BUY or SELL for whole day</div>
</div>

<div class="card">
<button class="buy" onclick="enterTrade('BUY')">BUY 0.01 AT ZONE - HOLD 5 DAYS</button>
<button class="sell" onclick="enterTrade('SELL')">SELL 0.01 AT ZONE - HOLD 5 DAYS</button>
<button style="background:#222;color:#aaa" onclick="localStorage.clear(); location.reload();">RESET LOCK (New Day)</button>
</div>

<script>
let lockedBias = localStorage.getItem('swingBias');
let lockedPrice = localStorage.getItem('swingPrice');
let lockedDate = localStorage.getItem('swingDate');

async function fetchGold(){
 try{
  let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
  let j=await r.json();
  let p=parseFloat(j.price);
  document.getElementById('price').innerText='$'+p.toFixed(2);
  
  let now=new Date();
  let todayStr=now.toDateString();
  // Lock at 10:00 if not locked today
  if(now.getHours()>=10 && now.getHours()<23 && lockedDate!==todayStr){
    // Simple stable bias: if PAXG > yesterday close approximation use trend of hour
    // To keep stable, we lock based on price at 10:00:00 - if last digit even = BUY, odd = SELL - but lock it once
    lockedBias = (p > 4125) ? 'SELL' : 'BUY'; // Gold at 4130 is too high = SELL bias for pullback
    if(p>4130) lockedBias='SELL'; else lockedBias='BUY';
    lockedPrice=p;
    lockedDate=todayStr;
    localStorage.setItem('swingBias',lockedBias);
    localStorage.setItem('swingPrice',lockedPrice);
    localStorage.setItem('swingDate',lockedDate);
  }
  showLocked(p);
 }catch(e){}
}
function showLocked(currentP){
 let zoneEl=document.getElementById('zone');
 let actionEl=document.getElementById('action');
 let statusEl=document.getElementById('status');
 let dateEl=document.getElementById('lockdate');
 if(!lockedBias){
   zoneEl.innerHTML='<span class=yellow>Waiting for 10:00 to lock signal...</span>';
   statusEl.innerText='Waiting 10:00 lock';
   return;
 }
 dateEl.innerText=lockedDate+' @ $'+parseFloat(lockedPrice).toFixed(2);
 statusEl.innerHTML="<span class='green'>LOCKED - Won't change today</span>";
 if(lockedBias==='BUY'){
   let entry=(parseFloat(lockedPrice)-10).toFixed(0);
   zoneEl.innerHTML=`<span class=green>BUY NOW<br>Entry Zone: ${entry} - ${parseFloat(lockedPrice).toFixed(0)}<br>HOLD on 4H 5 Days</span>`;
   actionEl.innerText=`ACTION: Today bias = BUY. On 4H wait pullback to ${entry}, BUY 0.01, SL $8, BE at +$5, HOLD to $25`;
 }else{
   let entry=(parseFloat(lockedPrice)+10).toFixed(0);
   zoneEl.innerHTML=`<span class=red>SELL NOW<br>Entry Zone: ${parseFloat(lockedPrice).toFixed(0)} - ${entry}<br>HOLD on 4H 5 Days</span>`;
   actionEl.innerText=`ACTION: Today bias = SELL. Gold at ${currentP.toFixed(0)} is high. On 4H wait push to ${entry}, SELL 0.01, SL $8, BE at +$5`;
 }
}

setInterval(fetchGold,5000); fetchGold();

// Alarm once at 10:00
let alarmPlayed=false;
setInterval(()=>{
 let n=new Date();
 if(n.getHours()===10 && n.getMinutes()===0 && n.getSeconds()<3 && !alarmPlayed){
  alarmPlayed=true;
  let a=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); a.loop=true; a.play().catch(()=>{});
  setTimeout(()=>{alert("10:00 LOCKED! Signal for today: "+lockedBias+" \nIt will NOT change today."); a.pause();},600);
 }
 if(n.getHours()!==10) alarmPlayed=false;
},1000);

function enterTrade(d){alert(d+" locked today.\nRemember: HOLD 5 DAYS on 4H\nSL $8 | BE at +$5");}
</script>
</body>
</html>
