<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA SWING B - AUTO SIGNAL</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.card{background:#161616;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px}
.green{color:#00ff88}.red{color:#ff4444}.yellow{color:#ffcc00}
button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px;font-size:16px}
.buy{background:#00ff88;color:#000}.sell{background:#ff4444;color:#fff}
.zone{font-size:22px;font-weight:bold;margin:6px 0}
</style>
</head>
<body>
<h2>NOVA SWING B V3 🎯 AUTO</h2>
<div class="card">
Gold Price: <b id="price">Loading...</b> | <span id="status">Waiting 10:00</span><br>
<span id="countdown" class="yellow"></span>
</div>

<div class="card">
4H TIMEFRAME SIGNAL:<br>
<div id="zone" class="zone yellow">Scanning 4H Zone...</div>
<div id="action" style="font-size:13px;color:#aaa">Will auto-calculate BUY/SELL zone at 10:00</div>
Hold: <b id="hold">0/5 days</b> | SL $8 | TP $25 | BE at +$5
</div>

<div class="card">
<button class="buy" id="buyBtn" onclick="enterTrade('BUY')">BUY 0.01 AT ZONE - HOLD 5 DAYS</button>
<button class="sell" id="sellBtn" onclick="enterTrade('SELL')">SELL 0.01 AT ZONE - HOLD 5 DAYS</button>
<button style="background:#222;color:#aaa" onclick="closeAll()">CLOSE & LOCK</button>
</div>

<script>
let goldPrice=0, lastFetch=0;
async function fetchGold(){
 try{
  let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
  let j=await r.json();
  goldPrice=parseFloat(j.price);
  document.getElementById('price').innerText='$'+goldPrice.toFixed(2);
  calcZone();
 }catch(e){document.getElementById('price').innerText='Offline - Use TradingView D1';}
}
function calcZone(){
 if(!goldPrice) return;
 let now=new Date();
 if(now.getHours()<10 || now.getHours()>=23){
   document.getElementById('zone').innerHTML='<span class=yellow>OUTSIDE HOURS - Wait for 10:00 alarm</span>';
   document.getElementById('action').innerText='Market closed for Swing B. At 10:00 I will show BUY or SELL zone.';
   return;
 }
 // Simple 4H logic for $10: if price % 20 logic to create zone
 let buyZone = (Math.floor(goldPrice/10)*10) - 2;
 let sellZone = (Math.ceil(goldPrice/10)*10) + 2;
 // Auto bias: if price above 00 level = BUY bias, below = SELL bias
 let bias = (goldPrice % 10) > 5 ? 'BUY' : 'SELL';
 let color = bias==='BUY' ? 'green' : 'red';
 document.getElementById('zone').innerHTML=`<span class=${color}>${bias} NOW @ ${goldPrice.toFixed(1)}<br>HOLD on 4H<br>Zone: ${buyZone} - ${sellZone}</span>`;
 document.getElementById('action').innerText=bias==='BUY' 
 ? `ACTION: On 4H timeframe, wait for pullback to ${buyZone}, then BUY 0.01 and HOLD 5 days. BE at +$5`
 : `ACTION: On 4H timeframe, wait for pullback to ${sellZone}, then SELL 0.01 and HOLD 5 days. BE at +$5`;
}

setInterval(fetchGold,10000); fetchGold();

setInterval(()=>{
 let now=new Date();
 let h=now.getHours(),m=now.getMinutes();
 let cd=document.getElementById('countdown');
 let st=document.getElementById('status');
 if(h>=10 && h<23){st.innerHTML="<span class='green'>LIVE - 4H Zone Active</span>"; cd.innerText=""; calcZone();}
 else {st.innerText="Waiting 10:00"; let mins=(10*60-(h*60+m)+1440)%1440; cd.innerText="⏰ Alarm in "+mins+" mins";}
},1000);

// ALARM + AUTO VOICE
let alarmPlayed=false;
setInterval(()=>{
 let n=new Date();
 if(n.getHours()===10 && n.getMinutes()===0 && n.getSeconds()<3 && !alarmPlayed){
  alarmPlayed=true;
  let a=new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg"); a.loop=true; a.play().catch(()=>{});
  fetchGold();
  setTimeout(()=>{alert("⏰ 10:00 UNLOCKED!\n\n"+document.getElementById('zone').innerText+"\n\nCheck 4H chart now on phone and ENTER 0.01 HOLD 5 DAYS"); a.pause();},600);
 }
 if(n.getHours()!==10) alarmPlayed=false;
},1000);

function enterTrade(d){alert(d+" 0.01 entered on 4H zone.\nHOLD 3-5 DAYS\nSL $8 | BE at +$5 | TP $25"); document.getElementById('hold').innerText="Day 1 / 5 - HOLDING "+d+" on 4H";}
function closeAll(){document.getElementById('hold').innerText="0/5 days - Closed"; alert("Closed & Locked till next week");}
</script>
</body>
 </html>
