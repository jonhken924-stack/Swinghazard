<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUIDE ROBOT v8.2 - BUY/SELL</title>
<style>
body{background:#060a14;color:#fff;font-family:Arial;padding:12px}
.box{max-width:420px;margin:0 auto}
.head{background:#0e1a33;border:1px solid #1e355a;border-radius:18px;padding:18px;text-align:center}
.price{font-size:38px;font-weight:900;color:#ffcc00}
.card{background:#12142b;border:1px solid #1d3458;border-radius:16px;padding:14px;margin-top:12px}
.btn{width:100%;padding:18px;border:none;border-radius:14px;font-weight:900;font-size:17px;background:linear-gradient(90deg,#00e676,#00b248);color:#000;cursor:pointer}
.sig{padding:20px;border-radius:14px;text-align:center;font-weight:900;font-size:16px;margin-top:12px;line-height:1.4}
.wait{background:#1a1a2a;color:#888;border:1px dashed #444}
.buy{background:linear-gradient(135deg,#2962ff,#0039cb);color:#fff;animation:b 1.2s infinite}
.sell{background:linear-gradient(135deg,#ff1744,#880000);color:#fff;animation:b 1.2s infinite}
@keyframes b{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid #1a2a4a}
</style>
</head>
<body>
<div class="box">
<div class="head">
<div style="font-size:11px;color:#00e676;font-weight:800">🤖 GUIDE ROBOT v8.2 - BUY or SELL</div>
<div id="p" class="price">4185.15</div>
<div id="info" style="font-size:11px;color:#8aa0be">Live guide - Tells you BUY or SELL</div>
</div>

<div class="card">
<button class="btn" onclick="go()">🤖 START GUIDE ROBOT</button>
<div style="font-size:10px;color:#7a8aa3;margin-top:8px">Robot will tell you: BUY or SELL or WAIT - No guess</div>
</div>

<div class="card" id="c" style="display:none">
<div id="s" class="sig wait">🤖 Starting guide...</div>

<div style="background:#0c1220;border-radius:12px;padding:12px;margin-top:12px">
<div style="font-size:11px;color:#00e676;font-weight:800;margin-bottom:8px">🤖 ROBOT GUIDE - What to do now</div>
<div class="row"><span>Current Price:</span><span id="cp" style="color:#ffcc00">4185.15</span></div>
<div class="row"><span>Trend H1:</span><span id="tr">--</span></div>
<div class="row"><span>Action:</span><span id="ac" style="font-weight:900">--</span></div>
<div class="row"><span>Entry Zone:</span><span id="zo">--</span></div>
<div class="row"><span>Why:</span><span id="wh">--</span></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<div style="background:#0c1220;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px">SL $4 Safe</div><b id="sl">--</b></div>
<div style="background:#0c1220;border-radius:10px;padding:10px;text-align:center"><div style="font-size:10px">TP $6 Hold 1hr</div><b id="tp">--</b></div>
</div>

<div id="mt" style="font-size:12px;background:#0f1f0f;border:1px solid #00e676;border-radius:10px;padding:12px;margin-top:10px;line-height:1.6"></div>
<div id="cd" style="font-size:11px;color:#00e676;text-align:center;margin-top:8px"></div>
</div>
</div>

<script>
var on=false, t=null, n=0, price=4185.15, last=0;

function go(){
  on=!on;
  var b=document.querySelector('.btn');
  if(on){
    b.innerHTML='⏸ STOP GUIDE';
    b.style.background='#1e2a3f';
    b.style.color='#fff';
    document.getElementById('c').style.display='block';
    guide();
    t=setInterval(guide,4000);
  }else{
    b.innerHTML='🤖 START GUIDE ROBOT';
    b.style.background='linear-gradient(90deg,#00e676,#00b248)';
    b.style.color='#000';
    clearInterval(t);
  }
}

function guide(){
  n++;
  price += (Math.random()-0.45)*0.6;
  if(price>4190)price=4189;
  if(price<4165)price=4166;

  document.getElementById('p').innerHTML='GOLD '+price.toFixed(2);
  document.getElementById('cp').innerHTML=price.toFixed(2);
  document.getElementById('info').innerHTML='Guide #'+n+' • '+new Date().toLocaleTimeString();

  var box=document.getElementById('s');
  var trend = price>4180 ? 'BULLISH UP' : price<4175 ? 'BEARISH DOWN' : 'RANGING';
  var canTrade = (Date.now()-last)>120000;

  document.getElementById('tr').innerHTML=trend;

  if(price>=4175 && price<=4182 && canTrade){
    last=Date.now();
    box.className='sig buy';
    box.innerHTML='🟢 GUIDE: BUY NOW @ '+price.toFixed(2)+'<br><span style="font-size:12px">Bullish pullback - BUY</span>';
    document.getElementById('ac').innerHTML='<span style="color:#2962ff">BUY NOW</span>';
    document.getElementById('zo').innerHTML='4175-4182 BUY zone';
    document.getElementById('wh').innerHTML='Bullish trend + pullback = BUY';
    document.getElementById('sl').innerHTML=(price-4).toFixed(2);
    document.getElementById('tp').innerHTML=(price+6).toFixed(2);
    document.getElementById('mt').innerHTML='<b style="color:#2962ff">✅ DO THIS NOW:</b><br>1. Open MT5<br>2. BUY 0.01 GOLD @ '+price.toFixed(2)+'<br>3. SL '+(price-4).toFixed(2)+' ($4 safe for $5)<br>4. TP '+(price+6).toFixed(2)+' ($6 profit)<br>5. Hold 1hr - Don\'t close early<br><br><span style="color:#00e676">Robot says BUY because trend is UP</span>';
    document.getElementById('cd').innerHTML='⏰ Hold 60 min - Robot guiding BUY';
  }
  else if(price>=4186 && canTrade && n%5===0){
    last=Date.now();
    box.className='sig sell';
    box.innerHTML='🔴 GUIDE: SELL NOW @ '+price.toFixed(2)+'<br><span style="font-size:12px">Top resistance - SELL scalp</span>';
    document.getElementById('ac').innerHTML='<span style="color:#ff1744">SELL NOW</span>';
    document.getElementById('zo').innerHTML='4186-4190 SELL scalp';
    document.getElementById('wh').innerHTML='Price too high 4186 - short pullback';
    document.getElementById('sl').innerHTML=(price+4).toFixed(2);
    document.getElementById('tp').innerHTML=(price-6).toFixed(2);
    document.getElementById('mt').innerHTML='<b style="color:#ff1744">✅ DO THIS NOW:</b><br>1. MT5 SELL 0.01 @ '+price.toFixed(2)+'<br>2. SL '+(price+4).toFixed(2)+'<br>3. TP '+(price-6).toFixed(2)+'<br>4. Hold 1hr max<br><br><span style="color:#ff5a5a">Robot says SELL - small pullback from top</span>';
    document.getElementById('cd').innerHTML='⏰ Hold 60 min - Robot guiding SELL';
  }
  else{
    box.className='sig wait';
    if(price>4183){
      box.innerHTML='⏳ GUIDE: WAIT<br><span style="font-size:11px">Price '+price.toFixed(2)+' too high now<br>Wait for drop to 4175-4182 then BUY</span>';
      document.getElementById('ac').innerHTML='<span style="color:#ffcc00">WAIT</span>';
      document.getElementById('zo').innerHTML='Wait 4175-4182 for BUY';
      document.getElementById('wh').innerHTML='Price at top 4185 - don\'t BUY high';
      document.getElementById('mt').innerHTML='<b style="color:#ffcc00">⏳ WAIT:</b><br>Price '+price.toFixed(2)+' is high<br>Don\'t BUY now<br>Wait drop to 4175-4182 then robot will say BUY<br>Patient = safe for $5';
    }else{
      box.innerHTML='🤖 ANALYZING '+price.toFixed(2)+'<br><span style="font-size:11px">Checking if BUY or SELL...<br>Next guide in 4 sec</span>';
      document.getElementById('ac').innerHTML='ANALYZING';
    }
  }
}
</script>
</body>
  </html>
