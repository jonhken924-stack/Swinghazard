<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA V19 SMALL LOSS</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.card{background:#111;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:10px;text-align:center}
input{width:100%;padding:14px;font-size:20px;text-align:center;background:#000;color:#0f0;border:2px solid #0f0;border-radius:8px}
button{width:100%;padding:14px;margin-top:8px;font-weight:bold;border-radius:8px;border:0}
.armed{background:#0f0;color:#000;animation:b1 0.5s infinite}
.ring{background:#f00;color:#fff;animation:b2 0.3s infinite;font-size:20px}
@keyframes b1{50%{background:#fff}} @keyframes b2{50%{background:#ff0;color:#000}}
</style>
</head>
<body>
<h3 style="text-align:center">NOVA V19 ✅ SMALL LOSS</h3>

<div class="card">
<div style="color:#888;font-size:10px">LOCKED - SAME FOR ALL</div>
<div style="color:#ffcc00;font-size:26px;font-weight:bold" id="locked">--</div>
<div style="font-size:11px" id="count"></div>
<button onclick="scanNext()" style="background:#ff4444;color:#fff">🔍 SCAN NEXT SIGNAL</button>
</div>

<div class="card" style="background:#0a2a4a" id="tp2">TP2</div>
<div class="card" style="background:#0a1a3a;border:2px solid #0f0" id="tp1">TP1</div>
<div class="card" style="background:#332a00;border:2px solid #fc0;color:#fc0;font-weight:bold" id="entry">ZONE</div>
<div class="card" style="background:#3a0a0a" id="sl">SL SMALL</div>

<div class="card">
<input id="p" type="number" placeholder="Price">
<button onclick="c()" style="background:#ffcc00;color:#000">CHECK ZONE</button>
<button id="alarmBtn" onclick="setAlarm()" style="background:#111;color:#0f0;border:2px solid #0f0">🔔 SET ALARM FOR TP</button>
<button id="stopBtn" onclick="stopAlarm()" style="background:#333;display:none">🔇 STOP ALARM</button>
<div id="r" style="margin-top:10px;font-weight:bold;min-height:24px"></div>
<div style="margin-top:10px;font-size:10px;color:#666">NEW: SL only $150 loss (-$1.5 on 0.01 lot) <br>TP1 $300 profit (+$3) = 1:2 GOOD RR</div>
</div>

<script>
let lp=localStorage.getItem('v7_btcPrice')||'83066.2';
let lb=localStorage.getItem('v7_btcBias')||'BUY';
let tp1Val=0, alarmArmed=false, ringLoop=null, audioCtx=null;

function refresh(){
 let low=parseFloat(lp)-100, high=parseFloat(lp);
 if(lb!=='BUY'){ low=parseFloat(lp); high=parseFloat(lp)+100; }
 // SMALL LOSS NOW
 let sl=lb==='BUY'?low-150:high+150;
 tp1Val=lb==='BUY'?high+300:low-300;
 let tp2=lb==='BUY'?high+500:low-500;
 document.getElementById('locked').innerText='$'+lp+' '+lb;
 document.getElementById('entry').innerText='🟡 '+lb+' ZONE '+low.toFixed(1)+' - '+high.toFixed(1)+' (100 width)';
 document.getElementById('sl').innerText='🔴 SL $'+sl.toFixed(1)+' (-$150 = -$1.5 small)';
 document.getElementById('tp1').innerText='🔵 TP1 $'+tp1Val.toFixed(1)+' (+$300 = +$3)';
 document.getElementById('tp2').innerText='🔵 TP2 $'+tp2.toFixed(1)+' (+$500 runner)';
}
refresh();

function c(){
 let v=parseFloat(document.getElementById('p').value);
 let r=document.getElementById('r'); if(!v) return;
 let low=parseFloat(lp)-100, high=parseFloat(lp);
 if(lb!=='BUY'){ low=parseFloat(lp); high=parseFloat(lp)+100; }
 if(v>=low && v<=high) r.innerHTML='<span style="color:#0f0">✅ BUY NOW '+v+'</span>';
 else if(v<low) r.innerHTML='<span style="color:#f44">🔻 BELOW '+v+'</span>';
 else r.innerHTML='<span style="color:#fc0">🔺 ABOVE '+v+'</span>';
 if((lb==='BUY' && v>=tp1Val-0.5) || (lb!=='BUY' && v<=tp1Val+0.5)) triggerAlarm(v);
}

function setAlarm(){ alarmArmed=true; document.getElementById('alarmBtn').innerText='✅ ARMED $'+tp1Val.toFixed(1); document.getElementById('alarmBtn').className='armed'; try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} if(Notification && Notification.permission!=='granted') Notification.requestPermission(); alert('ARMED SMALL LOSS MODE: SL -$1.5 only, TP +$3'); }
function triggerAlarm(p){ document.getElementById('r').innerHTML='<span style="color:#ff0;font-size:26px">💰 TP HIT $'+p+' CLOSE!</span>'; document.getElementById('alarmBtn').style.display='none'; let sb=document.getElementById('stopBtn'); sb.style.display='block'; sb.className='ring'; ringLoop=setInterval(()=>{ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); let o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type='square'; o.frequency.value=1500; o.connect(g); g.connect(audioCtx.destination); g.gain.value=1; o.start(); setTimeout(()=>o.stop(),500);}catch(e){} if(navigator.vibrate) navigator.vibrate([1000,200,1000]); },700); }
function stopAlarm(){ clearInterval(ringLoop); alarmArmed=false; document.getElementById('alarmBtn').style.display='block'; document.getElementById('alarmBtn').className=''; document.getElementById('stopBtn').style.display='none'; }
function t(){ let n=new Date(); let e=new Date(n.toLocaleString('en-US',{timeZone:'Africa/Nairobi'})); let tom=new Date(e); tom.setDate(tom.getDate()+1); tom.setHours(10,0,0,0); let d=tom-e; let h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000); document.getElementById('count').innerHTML='EAT '+e.toLocaleTimeString()+' | Next '+h+'h '+m+'m'; }
setInterval(t,1000); t();
function scanNext(){ if(!confirm("Scan new?")) return; let newP=prompt("New FBS price",""); if(!newP) return; let p=parseFloat(newP); let bias=confirm("OK=BUY Cancel=SELL")?"BUY":"SELL"; localStorage.setItem('v7_btcPrice',p); localStorage.setItem('v7_btcBias',bias); lp=p; lb=bias; refresh(); location.reload(); }
</script>
</body>
</html>
