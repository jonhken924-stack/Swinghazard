<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V17 BUSY ALARM</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.card{background:#111;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:10px;text-align:center}
input{width:100%;padding:16px;font-size:24px;text-align:center;background:#000;color:#0f0;border:3px solid #0f0;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:16px;margin-top:8px;font-weight:bold;font-size:16px;border-radius:10px;border:0}
.alarm-armed{background:#00ff88;color:#000;animation:blink 0.5s infinite}
@keyframes blink{0%{background:#00ff88}50%{background:#fff;color:#f00}}
.alarm-ringing{background:#f00;color:#fff;animation:blink2 0.3s infinite;font-size:20px}
@keyframes blink2{0%{background:#f00}50%{background:#ff0;color:#000}}
</style>
</head>
<body>
<h3 style="text-align:center">🔔 V17 BUSY MODE ₿</h3>

<div class="card">
<div style="color:#ffcc00;font-size:28px;font-weight:bold" id="locked">--</div>
<div style="font-size:11px" id="count"></div>
<div id="tpInfo" style="color:#26a6ff;margin-top:6px;font-weight:bold"></div>
</div>

<div class="card">
<div>TYPE FBS PRICE NOW:</div>
<input id="p" type="number" placeholder="83693 = TP">
<button onclick="c()" style="background:#ffcc00;color:#000">CHECK ZONE</button>
<button id="alarmBtn" onclick="setAlarm()" style="background:#0f0;color:#000;border:3px solid #fff">🔔 SET LOUD ALARM FOR TP PROFIT<br><small>Will ring non-stop when hit</small></button>
<button id="stopBtn" onclick="stopAlarm()" style="background:#333;color:#888;display:none">🔇 STOP ALARM</button>
<div id="r" style="margin-top:12px;font-size:18px;font-weight:bold;min-height:30px"></div>
</div>

<script>
let lp=localStorage.getItem('v7_btcPrice')||'83093';
let lb=localStorage.getItem('v7_btcBias')||'BUY';
let tp1Val=0, alarmArmed=false, ringLoop=null, audioCtx=null;

function refresh(){
 let high=parseFloat(lp); let low=high-200;
 if(lb!=='BUY'){ low=parseFloat(lp); high=low+200; }
 tp1Val=lb==='BUY'?high+600:low-600;
 document.getElementById('locked').innerText='$'+lp+' '+lb;
 document.getElementById('tpInfo').innerText='ALARM TARGET TP1 $'+tp1Val.toFixed(0);
}
refresh();

function c(){
 let v=parseFloat(document.getElementById('p').value);
 if(!v) return;
 if((lb==='BUY' && v>=tp1Val) || (lb!=='BUY' && v<=tp1Val)){
   triggerLoudAlarm(v);
 } else {
   document.getElementById('r').innerHTML='<span style="color:#888">Price '+v+' - Not yet TP $'+tp1Val.toFixed(0)+'<br>Waiting... alarm armed</span>';
 }
}

function setAlarm(){
 alarmArmed=true;
 document.getElementById('alarmBtn').innerText='✅ ARMED FOR $'+tp1Val.toFixed(0)+' - RINGING WHEN HIT';
 document.getElementById('alarmBtn').className='alarm-armed';
 // Keep screen awake
 try{ if(navigator.wakeLock) navigator.wakeLock.request('screen'); }catch(e){}
 // Ask permission loud
 if(Notification && Notification.permission!=='granted') Notification.requestPermission();
 // Play silent to unlock audio
 try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
 alert('✅ LOUD ALARM ARMED!\n\n1. Keep this tab open\n2. Put volume FULL\n3. Plug charger\n4. Type price sometimes or keep here\n\nWhen TP hit, it will BEEP NON-STOP until you press STOP');
 // auto check every 3 sec
 setInterval(()=>{
   if(alarmArmed){
     let v=parseFloat(document.getElementById('p').value);
     if(v) c();
   }
 },3000);
}

function triggerLoudAlarm(price){
 if(!alarmArmed) return;
 document.getElementById('r').innerHTML='<span style="color:#ff0;font-size:26px">💰💰 TP HIT! $'+price+'<br>CLOSE NOW!</span>';
 document.getElementById('alarmBtn').style.display='none';
 document.getElementById('stopBtn').style.display='block';
 document.getElementById('stopBtn').className='alarm-ringing';
 // INFINITE LOUD RING
 ringLoop=setInterval(()=>{
   try{
     if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
     let o=audioCtx.createOscillator(), g=audioCtx.createGain();
     o.type='square'; o.frequency.value=1200;
     o.connect(g); g.connect(audioCtx.destination);
     g.gain.value=1; o.start(); setTimeout(()=>o.stop(),500);
   }catch(e){}
   if(navigator.vibrate) navigator.vibrate([1000,200,1000]);
 },800);
 // Notification spam
 if(Notification && Notification.permission==='granted'){
   new Notification('💰 PROFIT HIT $'+tp1Val.toFixed(0)+'!', {body:'Price '+price+' - CLOSE TRADE NOW!', requireInteraction:true});
 }
}

function stopAlarm(){
 clearInterval(ringLoop); alarmArmed=false;
 document.getElementById('alarmBtn').style.display='block';
 document.getElementById('alarmBtn').innerText='🔔 SET LOUD ALARM AGAIN';
 document.getElementById('alarmBtn').className='';
 document.getElementById('stopBtn').style.display='none';
 document.getElementById('r').innerHTML='🔇 Alarm stopped';
}

function t(){
 var now=new Date(); var eat=new Date(now.toLocaleString('en-US',{timeZone:'Africa/Nairobi'}));
 var tom=new Date(eat); tom.setDate(tom.getDate()+1); tom.setHours(10,0,0,0);
 var d=tom-eat; var h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000);
 document.getElementById('count').innerHTML='EAT '+eat.toLocaleTimeString()+' | Next lock '+h+'h '+m+'m';
}
setInterval(t,1000); t();
</script>
</body>
</html>
