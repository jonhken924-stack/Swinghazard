<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA V7 BTC 100% FIXED</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}
.card{background:#161616;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:10px}
.zone{font-size:22px;font-weight:bold}
button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px}
.sell{background:#ff4444;color:#fff}.buy{background:#00ff88;color:#000}
</style>
</head>
<body>
<h2>NOVA V7 ₿ BTC 100% ROBOT</h2>
<div class="card">
BTC: <b id="price" style="font-size:20px">$---</b><br>
Locked Price: <b id="lockedP">--</b> | Date: <span id="lockedD">--</span><br>
Status: <b id="status" style="color:#ffcc00">Checking lock...</b><br>
<button style="background:#ffcc00;color:#000;padding:10px;font-size:14px" onclick="enableNotify()">🔔 ENABLE 100% ALARM</button>
<div id="notifStatus" style="font-size:12px;color:#aaa">Entry will NEVER change today</div>
</div>
<div class="card">
<div id="zone" class="zone">--</div>
<div id="liveDist" style="margin-top:8px;color:#888"></div>
<div id="alarmLog" style="margin-top:8px;color:#00ff88;font-size:13px"></div>
</div>
<div class="card">
<button class="sell" onclick="alert('SELL 0.01 BTC at '+document.getElementById('zone').innerText)">SELL 0.01 BTC</button>
<button class="buy" onclick="alert('BUY 0.01 BTC at '+document.getElementById('zone').innerText)">BUY 0.01 BTC</button>
<button style="background:#222;color:#777" onclick="localStorage.clear();location.reload();">RESET FOR TOMORROW ONLY</button>
</div>

<script>
let lockedPrice = localStorage.getItem('v7_btcPrice');
let lockedDate = localStorage.getItem('v7_btcDate');
let lockedBias = localStorage.getItem('v7_btcBias');
let notifyEnabled=false, lastAlarmTime=0;

function enableNotify(){
 notifyEnabled=true;
 if("Notification" in window) Notification.requestPermission();
 document.getElementById('notifStatus').innerText='✅ ALARM ARMED - 100% will ring ONLY at entry';
 if(navigator.vibrate) navigator.vibrate(100);
 alert("✅ 100% ROBOT ARMED\n\nEntry will NOT change today.\nAlarm will ring ONLY when BTC touches your zone.\nLeave tab open in background.");
}

function triggerAlarm(current, low, high){
 let nowTime = Date.now();
 if(nowTime - lastAlarmTime < 300000) return; // 5 min cooldown, no spam
 lastAlarmTime = nowTime;
 document.getElementById('alarmLog').innerText = `🔔 ALARM TRIGGERED at $${current.toFixed(0)} - IN ZONE ${low}-${high}`;
 
 // Sound + Vibrate
 let audio = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");
 audio.play().catch(()=>{});
 if(navigator.vibrate) navigator.vibrate([500,200,500]);

 if("Notification" in window && Notification.permission==="granted"){
   new Notification(`₿ BTC ENTRY HIT $${current.toFixed(0)}`, {body:`Zone ${low}-${high}. TRADE NOW! SELL/BUY 0.01 BTC`, requireInteraction:true});
 }
 alert(`🔔 100% ENTRY HIT!\n\nBTC: $${current.toFixed(0)}\nZone: ${low} - ${high}\n\nACTION: Open FBS and trade NOW!\nSL $300 | BE at +$150`);
}

async function fetchBTC(){
 let p=0;
 try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); let j=await r.json(); p=parseFloat(j.price);}catch(e){}
 if(!p){
   try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); let j=await r.json(); p=j.bitcoin.usd;}catch(e){ p=83164; }
 }
 document.getElementById('price').innerText = '$'+p.toFixed(2);

 // LOCK LOGIC - 100% FIXED
 let todayStr = new Date().toDateString();
 let hour = new Date().getHours();

 // If no lock yet today, and it's past 10am, LOCK NOW - else wait
 if(!lockedDate || lockedDate !== todayStr){
   if(hour >= 10){
     // LOCK ONCE
     lockedPrice = p;
     lockedDate = todayStr;
     lockedBias = p > 83100 ? 'SELL' : 'BUY';
     localStorage.setItem('v7_btcPrice', lockedPrice);
     localStorage.setItem('v7_btcDate', lockedDate);
     localStorage.setItem('v7_btcBias', lockedBias);
     console.log("LOCKED NEW ENTRY", lockedPrice);
   } else {
     document.getElementById('status').innerText = `WAITING FOR 10:00 TO LOCK - Now ${hour}:00`;
     return;
   }
 }

 // SHOW LOCKED - NEVER CHANGES
 document.getElementById('lockedP').innerText = '$'+parseFloat(lockedPrice).toFixed(0);
 document.getElementById('lockedD').innerText = lockedDate;
 document.getElementById('status').innerText = `LOCKED ${lockedBias} - WILL NOT CHANGE TODAY`;
 document.getElementById('status').style.color = '#00ff88';

 let low = parseFloat(lockedPrice);
 let high = parseFloat(lockedPrice) + 200;
 if(lockedBias === 'BUY'){ low = parseFloat(lockedPrice)-200; high = parseFloat(lockedPrice); }

 document.getElementById('zone').innerHTML = `<span style="color:${lockedBias==='SELL'?'#ff4444':'#00ff88'}">${lockedBias} ZONE: ${low.toFixed(0)} - ${high.toFixed(0)}</span>`;
 document.getElementById('liveDist').innerText = `Live: $${p.toFixed(0)} | Need $${(low-p).toFixed(0)} to entry | Inside zone? ${p>=low && p<=high ? 'YES ✅' : 'NO - WAITING'}`;

 // ALARM ONLY IF INSIDE ZONE
 if(notifyEnabled && p >= low && p <= high){
   triggerAlarm(p, low.toFixed(0), high.toFixed(0));
 }
}

setInterval(fetchBTC, 3000);
fetchBTC();
</script>
</body>
</html>
