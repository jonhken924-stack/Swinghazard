<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA V14 SIMPLEST</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.card{background:#111;border:1px solid #333;border-radius:10px;padding:12px;margin-bottom:10px;text-align:center}
input{width:100%;padding:14px;font-size:20px;text-align:center;background:#000;color:#0f0;border:2px solid #0f0;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:14px;margin-top:8px;background:#ffcc00;color:#000;font-weight:bold;font-size:16px;border-radius:8px;border:0}
</style>
</head>
<body>
<h3 style="text-align:center">NOVA V14 SIMPLE ₿</h3>

<div class="card">
<div style="color:#888;font-size:11px">LOCKED TODAY - SAME FOR ALL CLIENTS</div>
<div style="color:#ffcc00;font-size:26px;font-weight:bold">$83093 BUY</div>
<div style="font-size:11px" id="count">Loading countdown...</div>
</div>

<div class="card" style="background:#0a2a4a;border-color:#26a6ff">🔵 TP2 $83993 RUNNER</div>
<div class="card" style="background:#0a1a3a;border-color:#26a6ff">🔵 TP1 $83693</div>
<div class="card" style="background:#332a00;border:2px solid #ffcc00;color:#ffcc00;font-weight:bold;font-size:16px">🟡 BUY ZONE 82893 - 83093</div>
<div class="card" style="background:#3a0a0a;border-color:#ff4444">🔴 SL $82593</div>

<div class="card">
<div style="margin-bottom:6px">Enter FBS price from MT5:</div>
<input id="p" type="number" placeholder="82892">
<button onclick="c()">CHECK ZONE</button>
<div id="r" style="margin-top:12px;font-size:18px;font-weight:bold;min-height:24px"></div>
</div>

<div class="card" style="font-size:12px;text-align:left">
BUY 0.01<br>SL 82593 | TP 83693 / 83993<br>BE at +150
</div>

<script>
function c(){
 var v=parseFloat(document.getElementById('p').value);
 var r=document.getElementById('r');
 if(!v){ r.innerHTML='Enter price first'; return; }
 if(v>=82893 && v<=83093){ r.innerHTML='<span style="color:#00ff88">✅ BUY NOW - INSIDE ZONE<br>Price '+v+' good!</span>'; }
 else if(v<82893){ r.innerHTML='<span style="color:#ff4444">🔻 BELOW ZONE '+v+'<br>Wait for bounce to 82893</span>'; }
 else { r.innerHTML='<span style="color:#ffcc00">🔺 ABOVE ZONE '+v+'<br>Wait pullback</span>'; }
}
function t(){
 var now=new Date();
 var eat=new Date(now.toLocaleString('en-US',{timeZone:'Africa/Nairobi'}));
 var tom=new Date(eat); tom.setDate(tom.getDate()+1); tom.setHours(10,0,0,0);
 var d=tom-eat;
 var h=Math.floor(d/3600000), m=Math.floor((d%3600000)/60000), s=Math.floor((d%60000)/1000);
 document.getElementById('count').innerHTML='EAT '+eat.toLocaleTimeString()+'<br>Next lock in: '+h+'h '+m+'m '+s+'s - Same for all';
}
setInterval(t,1000); t();
</script>
</body>
 </html>
