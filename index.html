<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA ROBOT BTC PRO CHART</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px;margin:0}
.card{background:#161616;border:1px solid #333;border-radius:12px;padding:12px;margin-bottom:10px}
.zone{font-size:20px;font-weight:bold}
.chart{position:relative;height:380px;background:#111;border:1px solid #333;border-radius:10px;margin-top:10px;overflow:hidden}
.line{position:absolute;left:0;right:0;height:2px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;font-weight:bold}
.entry{background:#00ff88;box-shadow:0 0 10px #00ff88;z-index:3;height:3px}
.sl{background:#ff4444;z-index:2}
.tp{background:#00bfff;z-index:2; border-top:2px dashed #00bfff}
.priceTag{position:absolute;right:8px;font-size:11px;background:#000;padding:2px 6px;border-radius:4px}
button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<h2 style="margin:8px 0">NOVA V8 ₿ BTC PRO CHART</h2>

<div class="card">
<div style="display:flex;justify-content:space-between">
<div>BTC: <b id="price" style="font-size:18px;color:#ffcc00">$---</b></div>
<div id="status" style="font-size:12px;color:#00ff88">--</div>
</div>
<div style="font-size:12px;color:#888">Locked: <span id="lockedP">--</span> | <span id="lockedD">--</span></div>
<button id="alarmBtn" style="background:#ffcc00;color:#000;padding:10px;font-size:14px" onclick="enableNotify()">🔔 ENABLE ALARM - RING WHILE USING PHONE</button>
<div id="notifStatus" style="font-size:11px;color:#aaa;margin-top:4px">Alarm rings ONLY inside zone</div>
</div>

<div class="card">
<div id="zoneText" class="zone">--</div>
<div class="chart" id="chart">
<!-- Lines injected by JS -->
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;font-size:12px;margin-top:8px;gap:6px">
<div style="background:#220000;padding:6px;border-radius:6px">🔴 SL: <b id="slPrice">--</b><br><span style="color:#ff8888">$300 risk on 0.01 BTC</span></div>
<div style="background:#001a22;padding:6px;border-radius:6px">🔵 TP1: <b id="tp1Price">--</b><br><span style="color:#88ccff">+$600 (2R)</span><br>TP2: <b id="tp2Price">--</b> +$900 (3R)</div>
</div>
<div id="liveInfo" style="font-size:12px;color:#888;margin-top:6px"></div>
</div>

<div class="card" style="font-size:12px">
<b>CLIENT READY SETUP:</b><br>
Entry: <span id="cEntry">--</span> | SL: <span id="cSL">--</span> | TP: <span id="cTP">--</span><br>
For $10 acc: 0.01 lot | For $63 acc: 0.01 lot (safe)<br>
BE at +$150 profit
</div>

<script>
let lockedPrice=localStorage.getItem('v7_btcPrice')||83093;
let lockedDate=localStorage.getItem('v7_btcDate')||new Date().toDateString();
let lockedBias=localStorage.getItem('v7_btcBias')||'BUY';
let notifyEnabled=false, lastAlarm=0;

function enableNotify(){
 notifyEnabled=true;
 if("Notification" in window) Notification.requestPermission();
 document.getElementById('notifStatus').innerText='✅ ARMED - Will ring at entry even on WhatsApp';
 document.getElementById('alarmBtn').style.background='#00ff88';
 if(navigator.vibrate) navigator.vibrate(100);
 alert("✅ ALARM ARMED\n\nNow you will see chart drawn below\nIt will ring ONLY when BTC inside your zone");
}

function drawChart(current, bias, entryLow, entryHigh){
 let chart=document.getElementById('chart');
 chart.innerHTML='';
 let sl, tp1, tp2;
 let chartMin, chartMax;
 
 if(bias==='BUY'){
   sl = entryLow - 300;
   tp1 = entryHigh + 600;
   tp2 = entryHigh + 900;
   chartMin = sl - 100;
   chartMax = tp2 + 100;
 } else {
   sl = entryHigh + 300;
   tp1 = entryLow - 600;
   tp2 = entryLow - 900;
   chartMin = tp2 - 100;
   chartMax = sl + 100;
 }
 
 let range = chartMax - chartMin;
 function yPos(price){ return ((chartMax - price)/range)*100; }

 // SL line
 let slDiv=document.createElement('div');
 slDiv.className='line sl';
 slDiv.style.top=yPos(sl)+'%';
 slDiv.innerHTML=`<span>🛑 SL STOP LOSS</span><span class="priceTag" style="color:#ff4444">$${sl.toFixed(0)}</span>`;
 chart.appendChild(slDiv);

 // Entry zone box
 let entryDiv=document.createElement('div');
 entryDiv.className='line entry';
 entryDiv.style.top=yPos((entryLow+entryHigh)/2)+'%';
 entryDiv.style.height='30px';
 entryDiv.style.background='rgba(0,255,136,0.25)';
 entryDiv.style.border='2px solid #00ff88';
 entryDiv.innerHTML=`<span>🟢 ${bias} ENTRY ZONE ${entryLow.toFixed(0)}-${entryHigh.toFixed(0)}</span><span class="priceTag" style="color:#00ff88">ENTER HERE</span>`;
 chart.appendChild(entryDiv);

 // TP lines
 let tp1Div=document.createElement('div');
 tp1Div.className='line tp';
 tp1Div.style.top=yPos(tp1)+'%';
 tp1Div.innerHTML=`<span>🎯 TP1 +$600</span><span class="priceTag" style="color:#00bfff">$${tp1.toFixed(0)}</span>`;
 chart.appendChild(tp1Div);

 let tp2Div=document.createElement('div');
 tp2Div.className='line tp';
 tp2Div.style.top=yPos(tp2)+'%';
 tp2Div.style.background='transparent';
 tp2Div.style.borderTop='2px dashed #0066ff';
 tp2Div.innerHTML=`<span>🎯 TP2 +$900 (Runner)</span><span class="priceTag" style="color:#0066ff">$${tp2.toFixed(0)}</span>`;
 chart.appendChild(tp2Div);

 // Current price line
 let curDiv=document.createElement('div');
 curDiv.className='line';
 curDiv.style.top=yPos(current)+'%';
 curDiv.style.background='#ffcc00';
 curDiv.style.zIndex='5';
 curDiv.innerHTML=`<span>⚡ LIVE $${current.toFixed(0)}</span><span class="priceTag" style="background:#ffcc00;color:#000">$${current.toFixed(0)}</span>`;
 chart.appendChild(curDiv);

 // Update text
 document.getElementById('slPrice').innerText='$'+sl.toFixed(0);
 document.getElementById('tp1Price').innerText='$'+tp1.toFixed(0);
 document.getElementById('tp2Price').innerText='$'+tp2.toFixed(0);
 document.getElementById('cEntry').innerText=entryLow.toFixed(0)+'-'+entryHigh.toFixed(0);
 document.getElementById('cSL').innerText=sl.toFixed(0);
 document.getElementById('cTP').innerText=tp1.toFixed(0)+' / '+tp2.toFixed(0);
}

async function fetchBTC(){
 let p=0;
 try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); let j=await r.json(); p=parseFloat(j.price);}catch(e){
   try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); let j=await r.json(); p=j.bitcoin.usd;}catch(e){ p=82991; }
 }
 document.getElementById('price').innerText='$'+p.toFixed(2);
 document.getElementById('lockedP').innerText='$'+parseFloat(lockedPrice).toFixed(0);
 document.getElementById('lockedD').innerText=lockedDate;
 document.getElementById('status').innerText='LOCKED '+lockedBias+' - FIXED TODAY';
 document.getElementById('status').style.color='#00ff88';

 let low=parseFloat(lockedPrice), high=parseFloat(lockedPrice)+200;
 if(lockedBias==='BUY'){ low=parseFloat(lockedPrice)-200; high=parseFloat(lockedPrice); }
 document.getElementById('zoneText').innerHTML=`<span style="color:${lockedBias==='BUY'?'#00ff88':'#ff4444'}">${lockedBias} ZONE: ${low.toFixed(0)} - ${high.toFixed(0)} ${p>=low&&p<=high?'✅ INSIDE - BUY NOW':''}</span>`;
 document.getElementById('liveInfo').innerText=`Live: $${p.toFixed(0)} | ${p>=low&&p<=high?'🔔 ALARM SHOULD BE RINGING NOW!':'Waiting for price to enter zone...'}`;

 drawChart(p, lockedBias, low, high);

 if(notifyEnabled && p>=low && p<=high && Date.now()-lastAlarm>300000){
   lastAlarm=Date.now();
   if(navigator.vibrate) navigator.vibrate([500,200,500]);
   if("Notification" in window && Notification.permission==="granted") new Notification(`₿ BUY NOW $${p.toFixed(0)}`, {body:`BTC in BUY zone ${low.toFixed(0)}-${high.toFixed(0)}. SL $${(low-300).toFixed(0)} TP $${(high+600).toFixed(0)}`});
 }
}
setInterval(fetchBTC,3000); fetchBTC();
</script>
</body>
 </html>
