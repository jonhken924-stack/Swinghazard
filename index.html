<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA GOLD FINAL</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:10px}
.card{background:#151515;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:10px;text-align:center}
input{width:100%;padding:18px;font-size:26px;text-align:center;background:#000;color:#ffd700;border:3px solid #ffd700;border-radius:10px;box-sizing:border-box}
button{width:100%;padding:16px;margin-top:10px;font-weight:bold;font-size:15px;border-radius:10px;border:0}
</style>
</head>
<body>
<h2 style="text-align:center;color:#ffd700">🪙 NOVA GOLD FINAL</h2>

<div class="card">
<div style="color:#888;font-size:11px">LOCKED SIGNAL</div>
<div style="color:#ffd700;font-size:30px;font-weight:bold" id="L">$3950 BUY</div>
<div id="C" style="font-size:11px;color:#666">EAT TIME</div>
<button onclick="SCAN()" style="background:#ff3344;color:#fff">🔍 SCAN NEXT GOLD SIGNAL</button>
<button onclick="RESET()" style="background:#222;color:#888;font-size:10px">RESET IF --</button>
</div>

<div class="card" style="background:#0d2a50" id="T2">TP2 $3960</div>
<div class="card" style="background:#0d1a40;border:2px solid #00ff88" id="T1">TP1 $3956 ALARM</div>
<div class="card" style="background:#332a00;border:2px solid #ffd700;color:#ffd700;font-weight:bold;font-size:18px" id="Z">ZONE 3948 - 3950</div>
<div class="card" style="background:#3a1010" id="S">SL 3945 SMALL LOSS</div>

<div class="card">
<input id="P" type="number" placeholder="3950.50">
<button onclick="CHECK()" style="background:#ffd700;color:#000">CHECK IF INSIDE ZONE</button>
<button id="AB" onclick="ARM()" style="background:#111;color:#0f0;border:2px solid #0f0">🔔 SET ALARM FOR TP</button>
<button id="SB" onclick="STOP()" style="background:#333;color:#fff;display:none">🔇 STOP ALARM</button>
<div id="R" style="margin-top:12px;font-size:20px;font-weight:bold;min-height:30px"></div>
</div>

<script>
let lp=3950.50, lb='BUY', tp1=3956.50;
let armed=false, loop=null, ctx=null;

function REF(){
 lp=parseFloat(localStorage.getItem('gold_p'))||3950.50;
 lb=localStorage.getItem('gold_b')||'BUY';
 let low=lp-2, high=lp; if(lb!='BUY'){low=lp; high=lp+2;}
 let sl=lb=='BUY'?low-3:high+3; tp1=lb=='BUY'?high+6:low-6; let tp2=lb=='BUY'?high+10:low-10;
 document.getElementById('L').innerText='$'+lp+' '+lb;
 document.getElementById('Z').innerText=lb+' ZONE '+low.toFixed(1)+' - '+high.toFixed(1);
 document.getElementById('S').innerText='SL '+sl.toFixed(1)+' LOSS $3 SMALL';
 document.getElementById('T1').innerText='TP1 '+tp1.toFixed(1)+' PROFIT $6 🔔';
 document.getElementById('T2').innerText='TP2 '+tp2.toFixed(1)+' RUNNER $10';
}
REF();

function CHECK(){
 let v=parseFloat(document.getElementById('P').value);
 let r=document.getElementById('R');
 if(!v){r.innerText='Enter price'; return;}
 let low=lp-2, high=lp; if(lb!='BUY'){low=lp; high=lp+2;}
 if(v>=low && v<=high) r.innerHTML='<span style="color:#0f0">✅ INSIDE BUY NOW '+v+'</span>';
 else if(v<low) r.innerHTML='<span style="color:#f55">🔻 BELOW '+v+'</span>';
 else r.innerHTML='<span style="color:#ff0">🔺 ABOVE '+v+'</span>';
 if((lb=='BUY' && v>=tp1-0.2) || (lb!='BUY' && v<=tp1+0.2)) RING(v);
}

function ARM(){
 armed=true;
 document.getElementById('AB').innerText='✅ ARMED $'+tp1+' WILL RING LOUD';
 document.getElementById('AB').style.background='#0f0'; document.getElementById('AB').style.color='#000';
 try{ctx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
 if(Notification && Notification.permission!='granted') Notification.requestPermission();
 document.getElementById('R').innerText='Alarm armed for $'+tp1;
}

function RING(p){
 if(!armed) return;
 document.getElementById('R').innerHTML='<span style="color:#ff0;font-size:28px">💰 PROFIT HIT $'+p+' CLOSE NOW!</span>';
 document.getElementById('AB').style.display='none';
 document.getElementById('SB').style.display='block';
 document.getElementById('SB').style.background='#f00';
 loop=setInterval(function(){
  try{
   if(!ctx) ctx=new(window.AudioContext||window.webkitAudioContext)();
   let o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=1400; o.type='square';
   o.connect(g); g.connect(ctx.destination); g.gain.value=1; o.start(); setTimeout(function(){o.stop()},500);
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([1000,300,1000]);
 },800);
}

function STOP(){ clearInterval(loop); armed=false; document.getElementById('AB').style.display='block'; document.getElementById('SB').style.display='none'; document.getElementById('AB').innerText='🔔 SET ALARM AGAIN'; document.getElementById('AB').style.background='#111'; document.getElementById('AB').style.color='#0f0';}

function SCAN(){
 let n=prompt('Enter NEW GOLD price from FBS e.g 3960',''); if(!n) return;
 let p=parseFloat(n); if(isNaN(p)) return;
 let b=confirm('OK=BUY, Cancel=SELL')?'BUY':'SELL';
 localStorage.setItem('gold_p',p); localStorage.setItem('gold_b',b);
 lp=p; lb=b; REF(); location.reload();
}
function RESET(){ localStorage.clear(); alert('Cleared! Reload'); location.reload(); }
setInterval(function(){ let d=new Date(); let e=new Date(d.toLocaleString('en-US',{timeZone:'Africa/Nairobi'})); document.getElementById('C').innerText='EAT '+e.toLocaleTimeString(); },1000);
</script>
</body>
 </html>
