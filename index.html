<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA V9 TV BOXES</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:8px;margin:0}
.card{background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:10px;margin-bottom:10px}
.chartWrap{position:relative;height:460px;background:#0e0e0e;border:1px solid #333;border-radius:10px;overflow:hidden}
.box{position:absolute;left:12%;right:18%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:12px;border-radius:2px}
.entryBox{border:2px solid #ffcc00;background:rgba(255,204,0,0.15);z-index:3}
.slBox{background:rgba(255,68,68,0.35);border:1px solid #ff4444;color:#ffb3b3;z-index:2}
.tpBox{background:rgba(38,166,255,0.25);border:1px solid #26a6ff;color:#88ccff;z-index:2}
.liveLine{position:absolute;left:0;right:0;height:2px;background:#ffcc00;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:11px;font-weight:bold;color:#000}
.priceLabel{position:absolute;right:0;background:#fff;color:#000;padding:2px 6px;font-size:11px;border-radius:3px;font-weight:bold}
</style>
</head>
<body>
<h3 style="margin:6px">NOVA V9 ₿ TV LONG/SHORT BOXES</h3>
<div class="card">
<div style="display:flex;justify-content:space-between;font-size:13px">
<div>BTC: <b id="price" style="color:#ffcc00;font-size:16px">$--</b> <span id="biasBadge" style="padding:2px 6px;border-radius:4px;font-size:11px">--</span></div>
<div id="status" style="color:#00ff88;font-size:11px">LOCKED</div>
</div>
<button style="width:100%;background:#ffcc00;color:#000;padding:9px;border:none;border-radius:8px;font-weight:bold;margin-top:6px" onclick="enable()">🔔 ENABLE ALARM (RING ON PHONE)</button>
</div>

<div class="card">
<div id="zoneTitle" style="font-weight:bold;font-size:18px;margin-bottom:6px">--</div>
<div class="chartWrap" id="chart"></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;font-size:11px;margin-top:6px;gap:4px;text-align:center">
<div style="background:#2a0a0a;padding:5px;border-radius:6px">🔴 SL<br><b id="slTxt">--</b><br><span style="color:#ff8888">-$300</span></div>
<div style="background:#1a1a00;padding:5px;border-radius:6px">🟡 ENTRY<br><b id="entryTxt">--</b></div>
<div style="background:#0a1a2a;padding:5px;border-radius:6px">🔵 TP<br><b id="tpTxt">--</b><br><span style="color:#88ccff">+$600 2R</span></div>
</div>
<div id="info" style="font-size:11px;color:#888;margin-top:6px"></div>
</div>

<script>
let lockedPrice=localStorage.getItem('v7_btcPrice')||83093;
let lockedBias=localStorage.getItem('v7_btcBias')||'BUY';
let lockedDate=localStorage.getItem('v7_btcDate')||new Date().toDateString();
let notify=false, lastAlarm=0;

function enable(){
 notify=true;
 if("Notification" in window) Notification.requestPermission();
 if(navigator.vibrate) navigator.vibrate(100);
 alert("✅ ARMED\n\nNow chart shows LONG or SHORT boxes like TradingView\nIf LONG -> green up, SL red below, TP blue above\nIf SHORT -> red down, SL red above, TP blue below");
}

function draw(p, bias, low, high){
 let c=document.getElementById('chart'); c.innerHTML='';
 let sl, tp1, tp2;
 if(bias==='BUY'){ sl=low-300; tp1=high+600; tp2=high+900; }
 else { sl=high+300; tp1=low-600; tp2=low-900; }

 let min=Math.min(sl,tp2,p)-120; let max=Math.max(sl,tp2,p)+120;
 let range=max-min;
 let y = price => ((max-price)/range)*100;

 // TP BOX
 let tpBox=document.createElement('div'); tpBox.className='box tpBox';
 tpBox.style.top=y(Math.max(tp1,tp2))+'%';
 tpBox.style.height=Math.abs(y(tp1)-y(low))+'%';
 tpBox.innerHTML=`<span>TP TARGET +$600 to +$900 (2R-3R) - Take Profit Zone</span>`;
 c.appendChild(tpBox);

 // ENTRY BOX - yellow like your screenshot
 let eBox=document.createElement('div'); eBox.className='box entryBox';
 eBox.style.top=y(high)+'%'; eBox.style.height=Math.abs(y(high)-y(low))+'%';
 eBox.innerHTML=`<span style="color:#ffcc00">⬤ ${bias} ENTRY ${low.toFixed(0)} - ${high.toFixed(0)}</span>`;
 c.appendChild(eBox);

 // SL BOX - red like TradingView
 let sBox=document.createElement('div'); sBox.className='box slBox';
 if(bias==='BUY'){
   sBox.style.top=y(low)+'%'; sBox.style.height=Math.abs(y(low)-y(sl))+'%';
 } else {
   sBox.style.top=y(sl)+'%'; sBox.style.height=Math.abs(y(high)-y(sl))+'%';
 }
 sBox.innerHTML=`<span>STOP LOSS $${sl.toFixed(0)} (-$300)</span>`;
 c.appendChild(sBox);

 // Live line
 let live=document.createElement('div'); live.className='liveLine';
 live.style.top=y(p)+'%';
 live.innerHTML=`<span style="background:#ffcc00;padding:1px 4px">⚡ LIVE $${p.toFixed(0)}</span><span style="background:#ffcc00;color:#000;padding:2px 6px;border-radius:3px;font-size:11px">$${p.toFixed(0)}</span>`;
 c.appendChild(live);

 // Price labels right side
 [[sl,'#ff4444'],[low,'#ffcc00'],[high,'#ffcc00'],[tp1,'#26a6ff'],[tp2,'#0066ff']].forEach(([pr][col])=>{
   let lbl=document.createElement('div'); lbl.className='priceLabel';
   lbl.style.top=y(pr)+'%'; lbl.style.background=col; lbl.style.color=col==='#ffcc00'?'#000':'#fff';
   lbl.innerText='$'+pr.toFixed(0); c.appendChild(lbl);
 });

 document.getElementById('slTxt').innerText='$'+sl.toFixed(0);
 document.getElementById('entryTxt').innerText=low.toFixed(0)+'-'+high.toFixed(0);
 document.getElementById('tpTxt').innerText='$'+tp1.toFixed(0)+' / $'+tp2.toFixed(0);
 document.getElementById('info').innerText=`${bias} POSITION: Entry ${low.toFixed(0)}-${high.toFixed(0)} | SL ${sl.toFixed(0)} | TP ${tp1.toFixed(0)} | Risk $300 on 0.01 BTC | ${p>=low&&p<=high?'✅ INSIDE ZONE - TRADE NOW!':''}`;
 document.getElementById('zoneTitle').innerHTML=`<span style="color:${bias==='BUY'?'#00ff88':'#ff4444'}">${bias} ZONE: ${low.toFixed(0)} - ${high.toFixed(0)} ${p>=low&&p<=high?'✅ BUY NOW':''}</span>`;
 document.getElementById('biasBadge').innerText=bias+' POSITION'; document.getElementById('biasBadge').style.background=bias==='BUY'?'#00ff88':'#ff4444'; document.getElementById('biasBadge').style.color='#000';

 if(notify && p>=low && p<=high && Date.now()-lastAlarm>300000){
   lastAlarm=Date.now();
   if(navigator.vibrate) navigator.vibrate([400][200][400]);
   new Audio("https://actions.google.com/sounds/v1/alarms/beep_short.ogg").play().catch(()=>{});
 }
}

async function fetchBTC(){
 let p=0;
 try{let r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT'); let j=await r.json(); p=parseFloat(j.price);}catch(e){
   try{let r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd'); let j=await r.json(); p=j.bitcoin.usd;}catch(e){ p=82972; }
 }
 document.getElementById('price').innerText='$'+p.toFixed(2);
 let low=parseFloat(lockedPrice), high=parseFloat(lockedPrice)+200;
 if(lockedBias==='BUY'){ low=parseFloat(lockedPrice)-200; high=parseFloat(lockedPrice); }
 draw(p, lockedBias, low, high);
}
setInterval(fetchBTC,3000); fetchBTC();
</script>
</body>
 </html>
